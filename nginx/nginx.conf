# Balanceador del backend.
# Escucha en el 5290 (el puerto registrado en los proveedores OAuth) y reparte
# las peticiones entre todas las réplicas del servicio "backend".
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # DNS interno de Docker: "backend" devuelve la IP de cada réplica.
    # Con "resolve" nginx vuelve a consultarlo cada 10 s, así que las réplicas
    # que se agregan, caen o se reinician se detectan sin reiniciar nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Si detrás de nginx hay un túnel HTTPS (ngrok, Cloudflare...), conserva su
    # X-Forwarded-Proto; si no, usa el esquema de la conexión.
    map $http_x_forwarded_proto $proxy_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream backend_servers {
        zone backend_servers 64k;
        server backend:5290 resolve max_fails=2 fail_timeout=10s;
    }

    # Las URL de /connect/authorize y las cookies de OAuth pueden ser largas.
    large_client_header_buffers 4 16k;
    client_max_body_size 20m;

    server {
        listen 5290;
        server_name _;

        # Para comprobar el balanceo: curl -I http://localhost:5290/openapi/v1.json
        add_header X-Servido-Por $upstream_addr always;

        location / {
            proxy_pass http://backend_servers;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;

            # Si una réplica no responde, reintenta con otra.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
